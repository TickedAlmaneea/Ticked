name: final_project
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  google_fonts: ^8.2.1
  image_picker: ^1.1.2
  supabase_flutter: ^2.17.2
  http: ^1.2.2
  url_launcher: ^6.3.1
  live_activities: ^2.6.0
  flutter_app_group_directory: ^1.1.0
  image: ^4.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
  

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
